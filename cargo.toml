[package]
name = "tordial_gs_manifold"
version = "0.1.0"
edition = "2021"

[lib]
name = "tordial_gs_manifold"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module", "abi3-py37"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
chrono = { version = "0.4", features = ["serde"] }

# Add any preexisting framework dependencies (e.g., tonic, tokio) beneath this line if required
